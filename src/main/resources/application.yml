# HTTP 服务统一挂载在 /api 下，前端和 Swagger 共用同一入口前缀。
server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-lost-found
  # 默认使用 local，profile 文件只负责导入本地 .env，不保存真实凭据。
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campus_lost_found_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=${APP_TIME_ZONE:Asia/Shanghai}&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      initialization-fail-timeout: -1
      pool-name: CampusMySqlPool
  data:
    # Redis 当前用于 JWT 吊销；WebSocket 票据和 AI 限流将在后续阶段复用。
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

mybatis-plus:
  configuration:
    # 数据库 snake_case 字段自动映射到 Java camelCase 属性。
    map-underscore-to-camel-case: true
    # 关闭 SQL 参数日志，避免用户密码或隐私内容进入控制台。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  # 管理端点只暴露健康和基础信息，不开放配置、环境变量等敏感端点。
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        database:
          include: db
        redis:
          include: redis
      show-details: never

springdoc:
  # Springdoc 根据 Controller 生成文档，路径与 /api context-path 叠加。
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # 空默认值迫使本地环境显式提供 JWT_SECRET，应用启动时会校验长度。
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  bootstrap-admin:
    # 默认不创建管理员；仅在首次初始化时临时启用。
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    nickname: ${ADMIN_NICKNAME:系统管理员}
  ai:
    # 智能问答通过后端直接调用 DeepSeek HTTP API，不把密钥暴露给浏览器。
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    chat-path: ${AI_CHAT_PATH:/chat/completions}
    model: ${AI_MODEL:deepseek-flash}
    api-key: ${AI_API_KEY:}
    connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${AI_RESPONSE_TIMEOUT_SECONDS:30}
    max-input-chars: ${AI_MAX_INPUT_CHARS:1000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:10}
  websocket:
    # 浏览器先换取短时一次性票据，再携带票据建立 WS；服务端不接收 URL 中的 JWT。
    ticket-ttl-seconds: ${WS_TICKET_TTL_SECONDS:30}
    send-time-limit-millis: ${WS_SEND_TIME_LIMIT_MILLIS:5000}
    send-buffer-size-bytes: ${WS_SEND_BUFFER_SIZE_BYTES:65536}

logging:
  level:
    root: INFO
    com.campus.lostfound: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"

